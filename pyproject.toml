[project]
name = "jwlegit"
version = "0.1.0"
description = "URL reputation checker — queries urlscan.io, VirusTotal, AbuseIPDB, Google Safe Browsing, RDAP, and TLS certificate analysis in parallel"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jan Wychowaniak", email = "43786923+janwychowaniak@users.noreply.github.com" },
]
keywords = ["security", "url", "reputation", "phishing", "malware", "urlscan", "virustotal", "abuseipdb", "safebrowsing", "rdap", "whois", "tls", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/janwychowaniak/jwlegit"
Repository = "https://github.com/janwychowaniak/jwlegit"
Issues = "https://github.com/janwychowaniak/jwlegit/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
jwlegit = "jwlegit.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jwlegit"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude",
    ".github",
    "CLAUDE.md",
]
